# Reverse proxy for the CMS Next.js app (listens on container port 80).
# Upstream: Docker Compose service name `app` on internal port 3001.
# For a bare-metal Next.js process on the same host, use:
#   server 127.0.0.1:3001;
#   (or localhost:3001)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream cms_nextjs {
    server app:3001;
    keepalive 32;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Matches next.config serverActions bodySizeLimit; allow headroom for multipart uploads
    client_max_body_size 25m;

    # Optional hardening
    proxy_http_version 1.1;
    proxy_redirect off;

    # Serve uploaded files directly from the bind-mounted host directory.
    # Next.js `output: standalone` does NOT serve public/ at runtime, so
    # nginx must handle /uploads itself to make uploaded images accessible.
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # access_log off; # Temporarily disabled to debug
        access_log /dev/stdout;
        error_log /dev/stderr debug;
    }

    location / {
        proxy_pass http://cms_nextjs;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_cache_bypass                 $http_upgrade;

        proxy_read_timeout  300s;
        proxy_connect_timeout 75s;
        proxy_send_timeout  300s;
    }
}
